name: nightly-e2e-live

# Runs the L1 live-smoke scenario (docs/specs/03-e2e.md "Live smoke") against
# the real deployed Render backend: claim -> signed proxy -> debate -> verdict
# -> transcript. Not part of the PR-gating `ci` workflow, because it spends
# real free-model requests and depends on the live host. It fails when the
# scenario fails, so a broken deploy is visible on the Actions tab.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: https://paper-trail-backend-jjpf.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_LIVE: "1"
      # Browser calls go through the signing proxy (docs/specs/05-backend-proxy.md),
      # so the live run needs the frontend's key as a repository secret.
      PAPER_TRAIL_FRONTEND_SIGNING_KEY_PRIVATE: ${{ secrets.PAPER_TRAIL_FRONTEND_SIGNING_KEY_PRIVATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --grep "L1 live smoke"
      - name: Upload the failure trace and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-results
          path: test-results/
          retention-days: 7

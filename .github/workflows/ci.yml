name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://paper-trail-backend-jjpf.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run --coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://paper-trail-backend-jjpf.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Spec 05 §4: the signing key's name and the minting code never reach a
      # client bundle.
      - name: No signing code in client bundles
        run: |
          if grep -rlE 'PAPER_TRAIL_FRONTEND_SIGNING_KEY_PRIVATE|createPrivateKey' .next/static; then
            echo "signing code leaked into .next/static" >&2
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    # Mocked mode, no live backend: the UI specs fulfil /api/backend/** in the
    # browser, and proxy.spec.ts drives the real proxy against a local mock
    # backend (tests/e2e/global-setup.ts) with a throwaway key pair that
    # playwright.config.ts generates per run. NEXT_PUBLIC_API_URL below is
    # overridden for the dev server by playwright.config.ts.
    env:
      NEXT_PUBLIC_API_URL: https://paper-trail-backend-jjpf.onrender.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # NOTE: no deploy job -- the Render service auto-deploys main on push. This
  # job verifies the deploy that push triggered actually came up. It is inert
  # unless the SMOKE_BASE_URL repository variable is set: tests/smoke.test.ts
  # self-skips and exits 0 without making a single HTTP request, so a fork PR
  # or a suspended service can never fail CI. Intentionally not part of the
  # `test` job above -- that job never receives SMOKE_BASE_URL, so it always
  # self-skips there.
  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Post-deploy /health smoke (skipped when SMOKE_BASE_URL is unset)
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: pnpm exec vitest run tests/smoke.test.ts
